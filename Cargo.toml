[package]
name = "aw-rss"
version = "0.1.0"
edition = "2024"
description = "Awused's personal rss reader"
readme = "README.md"
license = "MIT"
keywords = ["rss"]
homepage = "https://github.com/awused/aw-rss"
repository = "https://github.com/awused/aw-rss"

[dependencies]
async-channel = "2.5.0"
atom_syndication = { version = "0.12.7", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing", "tower-log"]}
awconf = { git = "https://github.com/awused/awconf" }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std", "alloc", "serde"] }
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
dateparser = "0.3.1"
derive_more = { version = "2.1.1", default-features = false, features = ["from", "deref", "deref_mut"] }
event-listener = "5.4.1"
futures-util = { version = "0.3.32", default-features = false }
hex = "0.4.3"
humansize = "2.1.3"
humantime = "2.3.0"
# TODO -- this one should get merged into Futures
mapped_futures = "0.2.1"
mime_guess = "2.0.5"
# can remove once_cell once std stabilizes get_mut
once_cell = "1.21.4"
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["brotli", "deflate", "json", "gzip", "rustls"] }
rust-embed = { version = "8.11.0", features = ["compression"] }
rss = { version = "2.0.12", default-features = false }
scraper = { version = "0.26.0", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
sha2 = "0.11.0"
shlex = "1.3.0"
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "chrono", "sqlite", "migrate"] }
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["macros", "process", "rt", "sync", "time"] }
tower = { version = "0.5.3", features = ["limit"] }
tower-http = { version = "0.6.10", features = ["trace", "timeout"] }
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5.2"
